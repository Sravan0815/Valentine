<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine 💖</title>
  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffd6e8;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h2 {
      margin-bottom: 25px;
    }

    .buttons {
      position: relative;
      height: 80px;
      width: 260px;
      margin: 0 auto;
    }

    button {
      padding: 12px 28px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    #yes {
      background: #ff4d88;
      color: white;
      position: absolute;
      left: 0;
      top: 20px;
      z-index: 2;
      transform: scale(1);
    }

    #no {
      background: #ccc;
      position: absolute;
      right: 0;
      top: 20px;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <h2>Soniya, will you be my Valentine? 💖</h2>
    <div class="buttons">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const card = document.getElementById("card");

    const noTexts = [
      "Are you sure?",
      "Think again",
      "You sure?",
      "You’re breaking my heart 💔",
      "Re-think 😢"
    ];

    let noIndex = 0;
    let yesScale = 1;

    // Move NO button randomly but stay away from YES
    function moveNoButton() {
      const x = Math.random() * 180; // max X
      const y = Math.random() * 40;  // max Y
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("click", () => {
      if (noIndex < noTexts.length) {
        noBtn.innerText = noTexts[noIndex];
        noIndex++;
      }

      // Grow Yes button slightly on each No click
      yesScale += 0.15;
      yesBtn.style.transform = `scale(${yesScale})`;

      // Move No button randomly
      moveNoButton();
    });

    yesBtn.addEventListener("click", () => {
      // Confetti
      confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });

      // Step 1: Best decision
      card.innerHTML = `
        <h2 style="animation: pop 0.6s ease;">Best decision ever 😌✨</h2>
        <p style="font-size:18px;">Soniya 💖</p>
      `;

      // Step 2 after 2s: Final message
      setTimeout(() => {
        confetti({ particleCount: 150, spread: 120, origin: { y: 0.5 } });
        card.innerHTML = `
          <h2 style="animation: pop 0.6s ease;">You're officially my Valentine 🥹💘</h2>
          <p style="font-size:18px;">You just made my whole day 💕</p>
          <p style="font-size:24px;">Best decision ever ✨💌💖</p>
        `;
      }, 2000);
    });
  </script>

</body>
</html>
